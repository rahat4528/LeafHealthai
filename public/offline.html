<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Crop Guardian</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f0fdf4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
      }
      .card {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        color: #16a34a;
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        color: #6b7280;
        font-size: 0.9rem;
        line-height: 1.6;
        margin: 0;
      }
      .btn {
        margin-top: 1.5rem;
        background: #16a34a;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 9999px;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🌿</div>
      <h1>You're Offline</h1>
      <p>
        Crop Guardian works offline once loaded. Please reconnect and reload the page to start. Your
        saved diagnoses are safe in local storage.
      </p>
      <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
